
name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test          # only runs if test job passes
    if: github.ref == 'refs/heads/dev'   # only on main branch, not PRs

    steps:
      - name: Trigger Railway Deploy
        run: |
          curl -X POST ${{ secrets.RAILWAY_DEPLOY_HOOK }}
        
