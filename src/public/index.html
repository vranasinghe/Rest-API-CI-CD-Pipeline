<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Modern Task Management Dashboard</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <main class="dashboard-container">
    <header class="dashboard-header">
      <div class="logo-area">
        <span class="logo-icon">⚡</span>
        <h1>Task<span class="gradient-text">Flow</span></h1>
      </div>
      <p class="subtitle">A sleek Node.js REST API demonstration with full CI/CD integration.</p>
    </header>

    <section class="task-form-card">
      <h2>Create New Task</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Task Title</label>
          <input type="text" id="task-title" placeholder="e.g. Implement user authentication" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="task-desc">Description <span class="optional">(optional)</span></label>
          <textarea id="task-desc" rows="3" placeholder="e.g. Set up JWT verification routes and test cases..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span>Add Task</span>
          <span class="btn-icon">＋</span>
        </button>
      </form>
    </section>

    <section class="task-list-section">
      <div class="list-header">
        <h2>Your Tasks</h2>
        <span class="task-counter" id="task-counter">0 Tasks</span>
      </div>

      <div id="tasks-container" class="tasks-grid">
        <!-- Loader / Empty states get rendered here by JS -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Fetching tasks from server...</p>
        </div>
      </div>
    </section>
  </main>

  <div id="notification-toast" class="toast hidden"></div>

  <!-- JS Logic -->
  <script src="app.js"></script>
</body>
</html>
